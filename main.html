<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление студентами</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #6d6a6a;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100vw;
            height: 100vh;
            background-color: #c0e0cc;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #97c6a1;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .content {
            display: flex;
            justify-content: space-around;
            flex-grow: 1;
            padding: 20px;
            background-color: #c0c0c0;
            font-size: 40px;
            text-indent: 80px;
        }
        .list {
            width: 40%;
            height: 100%;
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            overflow-y: auto;
        }
        .buttons {
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }
        button {
            background-color: #a16542;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }
        button:hover {
            background-color: #814f32;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #67d2d6;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            width: 300px;
            text-align: center;
        }
        .modal input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            display: block;
        }
        .checkbox-group {
            text-align: left;
            margin: 10px 0;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .checkbox-group input {
            margin-right: 10px;
        }
        .submit-btn {
            background: #777;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
        }
        .submit-btn:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>AIT</span>
            <div>
                <button>students</button>
                <button>stuff</button>
            </div>
        </div>
        <div class="content">
            <div class="list" id="studentsList"></div>
            <div class="list" id="subjectsList"></div>
        </div>
        <div class="buttons">
            <button id="newStudent">new student</button>
            <button id="approve">approve</button>
        </div>
    </div>
    
    <div class="overlay" id="overlay"></div>
    <div class="modal" id="newStudentModal">
        <h2>New Student</h2>
        <input type="text" placeholder="UserName" id="userName">
        <input type="password" placeholder="Password" id="password">
        <div class="checkbox-group">
            <label><input type="checkbox" value="Algebra"> Optional class</label>
            <label><input type="checkbox" value="Java"> Optional class</label>
            <label><input type="checkbox" value="IOS"> Optional class</label>
        </div>
        <button class="submit-btn" onclick="submitNewStudent()">Submit</button>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function fetchData() {
                console.log("Fetching data from server...");
                const students = ["student 1", "student 2", "student 3", "student 4"];
                const subjects = ["algebra", "java", "IOS", "CS"];
                updateList("studentsList", students);
                updateList("subjectsList", subjects);
            }
            
            function updateList(elementId, items) {
                const listElement = document.getElementById(elementId);
                listElement.innerHTML = "";
                items.forEach(item => {
                    const div = document.createElement("div");
                    div.textContent = item;
                    listElement.appendChild(div);
                });
            }
            
            fetchData();
        });

        const newStudentModal = document.getElementById('newStudentModal');
        const overlay = document.getElementById('overlay');
        const newStudentButton = document.getElementById('newStudent');

        newStudentButton.addEventListener('click', () => {
            newStudentModal.style.display = 'block';
            overlay.style.display = 'block';
        });

        overlay.addEventListener('click', () => {
            newStudentModal.style.display = 'none';
            overlay.style.display = 'none';
        });

        function submitNewStudent() {
            const userName = document.getElementById('userName').value;
            const password = document.getElementById('password').value;
            const optionalClasses = Array.from(document.querySelectorAll('.checkbox-group input:checked')).map(cb => cb.value);
            console.log("New Student:", { userName, password, optionalClasses });
            newStudentModal.style.display = 'none';
            overlay.style.display = 'none';
        }
    </script>
</body>
</html>
